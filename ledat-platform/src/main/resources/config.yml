cooldown:
  cleanup-startup-delay-seconds: 90
  cleanup-interval-seconds: 120

# Shared bounded caches for plugin-owned user data. Each cache controls its own
# TTL, maximum size and write-behind delay through the API builder.
user-cache:
  maintenance-interval-seconds: 15

profiles:
  cache-ttl-seconds: 21600
  negative-cache-ttl-seconds: 60
  maximum-cache-size: 5000

player-block-tracker:
  # Block place/break/explosion events update the chunk PDC automatically.
  auto-track: true

command:
  # Paper Brigadier native command registration. Existing plugin handlers still receive
  # LeDatPlatform CommandContext, but the client sees a real command tree.
  paper-native:
    # Hide subcommand branches from tab suggestions when sender lacks permission.
    # Root permission is still checked in CommandService to preserve no-permission messages.
    permission-requirements: true
    # Debug log each Paper command registration on lifecycle command reload.
    log-registration: false
    # Derive simple typed Brigadier arguments from usage strings when a command node
    # has no explicit argument metadata. Disable if a legacy command has custom raw syntax.
    infer-usage-arguments: true
    # Cap each suggestion response to avoid huge permission/material lists on busy servers.
    max-suggestions: 128
  error:
    cooldown-seconds: 2
    log-interval-ms: 10000
  defaults:
    unknown-message-key: command.unknown
    no-permission-message-key: command.no-permission
    player-only-message-key: command.player-only
    invalid-args-message-key: command.invalid-args
    cooldown-message-key: command.cooldown
    rate-limited-message-key: command.rate-limited
    error-message-key: command.error
    usage-message-key: command.usage
  diagnostics:
    legacy-warn-threshold: 1
    slow-handler-log-interval-ms: 10000
    # Backward-compatible key name; now means Paper native command registration failure should be ERROR instead of WARN.
    missing-plugin-yml-error: false
    list-limit: 60

placeholderapi:
  enabled: true

gui:
  default-size: 27
  close-cleanup-delay-ticks: 1
  session-ttl-seconds: 300
  stale-cleanup-interval-seconds: 30
  click-debounce-ms: 150
  diagnostics:
    warn-active-sessions: 200
    warn-reopen-guards: 32
    warn-blocked-rapid-clicks: 1000
    warn-failed-opens: 1

forms:
  enabled: true
  require-floodgate: false
  prefer-for-bedrock: true
  session-ttl-seconds: 180
  diagnostics:
    warn-active-sessions: 200
    warn-failed-opens: 1
    warn-invalid-responses: 10
    debug-routing: false
  dialog-routing:
    enabled: true
    bedrock-prefer-form: true
    java-use-existing-dialog-service: true
    unsupported-input-action: INVENTORY_FALLBACK
  security:
    one-time-submit: true
    reject-unknown-buttons: true
    reject-expired-sessions: true
    clear-session-on-quit: true
    log-invalid-response: true
  text:
    max-title-length: 64
    max-content-length: 2048
    # Used only when an Adventure object component has no sprite/head hover or readable runtime metadata.
    object-fallback: '[icon]'
    # Raw string options are parsed as MiniMessage. Unknown literal tags such as <player> remain visible.
    strip-minimessage-tags: true

sounds:
  enabled: true
  log-invalid: true
  cues:
    click:
      enabled: true
      sound: UI_BUTTON_CLICK
      category: MASTER
      volume: 0.8
      pitch: 1.0
      cooldown-ms: 80
    confirm:
      enabled: true
      sound: ENTITY_PLAYER_LEVELUP
      category: MASTER
      volume: 0.7
      pitch: 1.2
      cooldown-ms: 120
    cancel:
      enabled: true
      sound: BLOCK_NOTE_BLOCK_BASS
      category: MASTER
      volume: 0.6
      pitch: 0.8
      cooldown-ms: 120
    error:
      enabled: true
      sound: ENTITY_VILLAGER_NO
      category: MASTER
      volume: 0.7
      pitch: 1.0
      cooldown-ms: 150


# Paper native Dialog API wrapper. Paper introduced custom dialog API in 1.21.7;
# LeDatPlatform will use it when runtime/player is compatible and fallback to inventory GUI otherwise.
dialogs:
  enabled: true
  session-ttl-seconds: 300
  diagnostics:
    warn-active-sessions: 200
    warn-native-actions: 512
    warn-native-fallbacks: 1
    warn-failed-opens: 1
  actions:
    sound:
      cooldown-ms: 80
      warn-missing: true
  templates:
    auto-save-bundled: true
    folders:
      - dialogs
      - inventories
    action-prefixes:
      player: '[player]'
      console: '[console]'
      message: '[message]'
      sound: '[sound]'
      dialog: '[dialog]'
      close: '[close]'
  rich-tags:
    enabled: true
    # Uses Adventure object components when the runtime has them; otherwise it displays compact fallback glyphs.
    # Supported in dialog MiniMessage strings: <item:diamond>, <item:diamond_sword>, <head:{player}>.
    object-components:
      enabled: true
    # Minecraft atlas keys may change across versions. Keep configurable for future client changes.
    item-sprite-atlas: 'minecraft:items'
    item-sprite-prefix: 'minecraft:item/'
    block-sprite-atlas: 'minecraft:blocks'
    block-sprite-prefix: 'minecraft:block/'
    fallback:
      item-glyph: '▣'
      head-glyph: '☻'
  native:
    enabled: true
    min-client-version: '1.21.7'
    # If ViaVersion is not installed, Paper normally only allows compatible clients.
    # Keep true to use native dialogs on supported Paper runtime; set false to force fallback unless ViaVersion can verify client protocol.
    assume-compatible-without-client-detector: true
    default-columns: 2
    default-button-width: 150
  fallback:
    enabled: true
    default-size: 27
    info-slot: 13
    # Optional exact owner -> sanitized dialog ID -> Java inventory header MiniMessage.
    # Supports {rows} from actual fallback slots and {title} from the semantic Dialog title.
    # No wildcard/default entry; native Dialogs and Bedrock forms retain their semantic title.
    inventory-titles: {}
    input-hint-lore:
      - '<gray>Input này chỉ nhập trực tiếp trên client hỗ trợ Dialog.'
      - '<yellow>Fallback menu sẽ hướng dẫn command thay thế.'
    input-slots:
      - 4
      - 13
      - 22
    action-slots:
      - 10
      - 11
      - 12
      - 14
      - 15
      - 16
      - 20
      - 22
      - 24

# Vanilla ESC -> Server Links. These are URL links only; dialogs/commands are opened by plugin commands.
server-links:
  enabled: true
  server-name: 'LeDat Network'
  # On reload/startup with many online players, send links in small batches instead
  # of scheduling every player in one tick.
  apply-all-on-reload: true
  apply-all-initial-delay-ticks: 20
  apply-all-batch-size: 25
  apply-all-stagger-ticks: 2
  resend-on-join-delay-ticks: 20
  entries:
    modern-menu:
      enabled: true
      label: '<#C797FF><bold>Modern Menu</bold>'
      url: 'https://example.com/menu'
      permission: ''
    settings:
      enabled: true
      label: '<#2EEA87><bold>Settings</bold>'
      url: 'https://example.com/settings'
      permission: ''
    discord:
      enabled: true
