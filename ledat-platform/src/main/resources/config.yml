config-version: 25

debug:
  enabled: false

production-profile:
  enabled: false
  warning-interval-ms: 60000
  database:
    reject-main-thread-borrows: true
  command:
    slow-handler-warn-ms: 250
  executors:
    default-queue-capacity: 1024
    # Hard cap for outstanding delayed/periodic/running tasks per managed scheduled executor.
    scheduled-queue-capacity: 1024
    warn-queue-size: 512
    allow-core-timeout: true
    shutdown-timeout-seconds: 2
    shutdown-timeout-ms: 2000
    # Cache the expensive all-thread diagnostic scan used by guard placeholders.
    thread-scan-cache-ms: 5000
    warn-unregistered-ledat-threads: true
  scheduler:
    warn-disabled-owner-tasks: true

owner-lifecycle:
  # Platform safety net for child plugin reload/disable. Keeps Core registries leak-free.
  enabled: true
  cleanup-on-plugin-disable: true
  refresh-hooks-on-plugin-enable: true
  log-cleanup-summary: true
  log-stateless-cleanup: false
  skip-stateless-plugin-disable: true
  recent-limit: 20
  # Bounded durability wait before the plugin-owned database/pool is closed.
  user-cache-flush-timeout-seconds: 5
  # One shared deadline for cache flush + executor shutdown + storage close per owner.
  total-timeout-ms: 10000

language:
  # Default locale for console and players without a chosen locale.
  default: vi_VN
  # Fallback locale when a plugin bundle or key is missing.
  fallback: vi_VN
  # Legacy alias kept for readability; required-locales below is the loader source of truth.
  supported:
    - vi_VN
    - en_US
    - zh_CN
  required-locales:
    - vi_VN
    - en_US
    - zh_CN
  version:
    current: 5
  missing-message-log-interval-ms: 60000
  invalid-message-log-interval-ms: 60000
  plugin-bundles:
    # Child plugins can ship languages/<locale>.yml in their jar.
    # LeDatPlatform copies/loads them under plugins/<ChildPlugin>/languages/<locale>.yml.
    autoload: true
    save-missing-bundled: true
  diagnostics:
    warn-loaded-bundles: 256
    warn-missing-warning-keys: 80
    warn-invalid-warning-keys: 20
    warn-active-bossbars: 320

scheduler:
  # LeDatPlatform uses FoliaLib and relocates com.tcoded.folialib into the platform jar.
  backend: FOLIALIB
  async-warning-ms: 250
  slow-task-warn-ms: 250
  # Prevent repeated slow/error logs from flooding console on repeating tasks.
  slow-task-log-interval-ms: 10000
  task-log-errors: true
  # false = log lỗi task rồi giữ scheduler/timer sống; true = ném lại lỗi để debug nghiêm ngặt.
  task-rethrow-errors: false
  task-error-log-interval-ms: 10000
  diagnostics:
    warn-owner-count: 64
    warn-total-tracked-tasks: 256
    warn-plugin-tracked-tasks: 64
    warn-failed-tasks: 1
    warn-slow-tasks: 1
    list-limit: 20
    warn-stale-one-shot-tasks: 32

storage:
  # local maps to the existing YAML/provider-local fallback stores.
  # Set mode to mysql to use the LeDatPlatform shared database contract below.
  # Legacy database.enabled=true is still treated as mysql by the storage config migrator.
  # SQLITE uses plugins/LeDatPlatform/platform.db with WAL/busy-timeout.
  # Child plugins should use Data Service standard layout: plugins/<PluginName>/storage/data.yml or data.db.
  mode: local
  mysql-failure-policy: disable-provider
  standard-layout:
    enabled: true
    folder: storage
    default-yaml-file: data
    default-sqlite-file: data
  table-prefix: ledat
  executor:
    core-threads: 4
    max-threads: 12
    # true = grow workers up to max-threads before queueing. This keeps YAML/SQLite bursts from sitting behind only core-threads.
    scale-before-queue: true
    queue-capacity: 8192
    warn-queue-size: 2048
    queue-wait-warn-ms: 250
    queue-wait-log-interval-ms: 10000
    allow-core-timeout: true
    prestart-core-threads: true
    # Keep false to avoid creating DB/file worker threads during local/YAML-only startup.
    # SQL modes still honor prestart-core-threads for warm pools.
    prestart-local-mode: false
    shutdown-timeout-seconds: 3
    shutdown-timeout-ms: 3000
  safety:
    log-main-thread-borrows: true
    # Keep false until all LeDat series plugins are migrated to async DB API.
    reject-main-thread-borrows: false
    # Rate-limit warning spam when legacy code still borrows SQL connections from main thread.
    main-thread-borrow-warning-interval-ms: 60000
  query:
    slow-query-warn-ms: 250
    slow-query-log-interval-ms: 10000
  health:
    # Delay first health sweep so startup plugin enable work does not compete with
    # storage flush/checkpoint/guard diagnostics.
    startup-delay-ms: 15000
    interval-ms: 10000
  diagnostics:
    warn-unhealthy-units: 1
    warn-dirty-yaml-stores: 25
    warn-slow-tasks: 50
    warn-rejected-tasks: 1
  verification:
    # Runtime command: /ledatplatform storage verify [plugin|all] [--deep].
    # Keep deep-integrity-check false by default because PRAGMA integrity_check can be expensive on large SQLite files.
    flush-dirty-yaml: true
    warn-dirty-yaml: true
    checkpoint-sqlite: false
    deep-integrity-check: false
  pool:
    maximum-pool-size: 12
    minimum-idle: 2
    connection-timeout-ms: 5000
    validation-timeout-ms: 3000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
    leak-detection-threshold-ms: 0
  mysql:
    host: 127.0.0.1
    port: 3306
    database: minecraft
    username: minecraft
    password: ""
    ssl: false
    cache-prepared-statements: true
    prepared-statement-cache-size: 250
    prepared-statement-cache-sql-limit: 2048
    use-server-prepared-statements: true
    tcp-keep-alive: true
  sqlite:
    file: platform.db
    busy-timeout-ms: 5000
    journal-mode: WAL
    synchronous: NORMAL
    wal-autocheckpoint: 1000
    cache-size: 10000
    temp-store: MEMORY
    foreign-keys: true
    journal-size-limit-bytes: 67108864
    mmap-size-bytes: 0
    checkpoint-on-health-check: false
    checkpoint-on-close: true
    checkpoint-mode: PASSIVE
    close-checkpoint-mode: TRUNCATE
    optimize-on-checkpoint: true
  local-sqlite:
    # Managed per-plugin SQLite stores created by platform.database().sqliteStore(plugin, "data").
    # Files live at plugins/<PluginName>/storage/<name>.db and lazy-open on first use.
    enabled: true
    extension: .db
    checkpoint-on-health-check: false
    checkpoint-mode: PASSIVE
    close-checkpoint-mode: TRUNCATE
    optimize-on-health-check: false
    optimize-on-checkpoint: true
    health:
      skip-when-pool-busy: true
    integrity:
      quick-check-on-health: false
    pragma:
      # Overrides storage.sqlite.* for per-plugin local stores. NORMAL is the balanced default; use FULL for critical ledgers if you prefer durability over write speed.
      busy-timeout-ms: 5000
      journal-mode: WAL
      synchronous: NORMAL
      wal-autocheckpoint: 1000
      cache-size: 10000
      temp-store: MEMORY
      journal-size-limit-bytes: 67108864
      mmap-size-bytes: 0
    pool:
      # Default 2 keeps /ledatplatform storage health responsive for plugins that hold
      # one long-lived connection while still keeping SQLite concurrency bounded.
      maximum-pool-size: 2
      minimum-idle: 0
      connection-timeout-ms: 5000
      validation-timeout-ms: 3000
      idle-timeout-ms: 600000
      max-lifetime-ms: 1800000
      leak-detection-threshold-ms: 0
  yaml:
    # false = batch in memory and flush on health task/disable; true = safer but more I/O.
    write-through: false
    # Health task writes at most this many dirty YAML stores per sweep; 0 = unlimited.
    # Keep this above the busy-plugin count so a crash loses less recent player data without enabling write-through.
    health-flush-max-stores: 16
    # Save via .tmp + atomic move when supported. Keep one .bak copy before replacing existing files.
    backup-before-replace: true

database:
  compatibility-provider:
    # Publishes ledat.platform.database.provider.v1 for legacy/shaded LeDat modules.
    # Only exposes shared SQL when storage.mode=mysql to avoid MySQL-only consumers using SQLite accidentally.
    enabled: true
  # Shared MySQL stays disabled while storage.mode is local.
  # Set storage.mode=mysql, or legacy database.enabled=true, only after staging with real credentials.
  enabled: false
  type: mysql
  host: 127.0.0.1
  port: 3306
  database: minecraft
  username: minecraft
  password: ""
  ssl: false
  table-prefix: ledat
  mysql-failure-policy: disable-provider
  pool:
    maximum-pool-size: 12
    minimum-idle: 2
    connection-timeout-ms: 5000
    validation-timeout-ms: 3000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000
    leak-detection-threshold-ms: 0
    keepalive-time-ms: 0
    initialization-fail-timeout-ms: 1
  migrations:
    enabled: true
    acquire-timeout-ms: 10000
    lock-ttl-ms: 60000
  health:
    test-query: SELECT 1
    warn-after-ms: 1000
    interval-ms: 15000
    unhealthy-after-failures: 3
  safety:
    log-main-thread-borrows: true
    reject-main-thread-borrows: false
    max-concurrent-borrows: 12
    borrow-acquire-timeout-ms: 250
    waiting-threads-warn-threshold: 6
  query:
    # Compatibility metadata. The active shared worker is configured by storage.executor.*.
    executor-core-threads: 4
    executor-max-threads: 12
    queue-capacity: 8192
    slow-query-warn-ms: 250
    default-query-timeout-seconds: 10
    # Admission cap per normalized requester. Runtime also caps one owner at half the global storage queue.
    default-plugin-max-queued-tasks: 2048
  circuit-breaker:
    # Reserved compatibility settings; circuit breaking is not active in config-version 25.
    enabled: true
    failure-threshold: 8
    open-ms: 30000
  plugin-health:
    min-update-interval-ms: 5000
  write-behind:
    # Reserved compatibility settings; platform audit/ledger use their own bounded batching paths.
    enabled: true
    flush-interval-ms: 2000
    max-buffered-counter-keys: 50000
    max-buffered-counter-keys-per-plugin: 8000
    counter-batch-size: 500
    max-batches-per-cycle: 4
    early-flush-trigger-percent: 70
    early-flush-cooldown-ms: 500
    coalesced-max-keys: 25000
    coalesced-max-keys-per-plugin: 4000
    coalesced-flush-max-tasks: 1000
    audit-max-buffered-rows: 20000
    audit-batch-size: 500
    shutdown-flush-timeout-ms: 3000
  hot-writes:
    # Diagnostic policy metadata only; no automatic throttling is applied in config-version 25.
    window-ms: 2000
    warn-threshold-per-window: 1000
    throttle-threshold-per-window: 5000
  plugins:
    # Only max-queued-tasks is enforced by the current admission guard. Priority,
    # drop and hot-write values remain diagnostic compatibility metadata.
    ledat_shard_transfer:
      priority: critical
      max-queued-tasks: 4096
      drop-when-full: false
      hot-write-warn-threshold: 500
      hot-write-throttle-threshold: 2000
    mc_data_bridge:
      priority: critical
      max-queued-tasks: 4096
      drop-when-full: false
      hot-write-warn-threshold: 500
      hot-write-throttle-threshold: 2000
