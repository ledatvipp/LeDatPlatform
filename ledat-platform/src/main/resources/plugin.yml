name: LeDatPlatform
version: ${version}
main: vn.ledat.platform.core.LeDatPlatformPlugin
api-version: '1.21'
author: LeDat
folia-supported: true
libraries:
  - org.xerial:sqlite-jdbc:3.46.1.3
  - com.mysql:mysql-connector-j:9.1.0
softdepend:
  - PlaceholderAPI
  - Vault
  - LuckPerms
  - PlayerPoints
  - ItemsAdder
  - Oraxen
  - Nexo
  - MMOItems
  - TAB
  - UnlimitedNameTags
  - UnlimitedNametags
  - SkinsRestorer
  - WorldGuard
  - ViaVersion
  - Geyser-Spigot
  - floodgate
  - Floodgate
commands:
  ledatplatform:
    description: LeDatPlatform core command
    usage: /ledatplatform <status|doctor|scheduler|commands|storage|caches|items|profiles|blocks|economy|hooks|gui|dialogs|forms|reload>
    permission: ledatplatform.admin
    aliases: [ledatcore, ledatdoctor]
permissions:
  ledatplatform.admin:
    description: Allows using LeDatPlatform admin commands
    default: op
