language-version: 6
prefix: ''
command:
  no-permission: '<#FF5A6E>You do not have permission <white>{permission}<#FF5A6E>.'
  player-only: '<#FF5A6E>This command is player-only.'
  cooldown: '<#BFC7D5>Please wait <#5899EE>{time}s<#BFC7D5> before using this again.'
  rate-limited: '<#FFA94D>You are doing that too fast. <#BFC7D5>Try again in <#5899EE>{time}s<#BFC7D5>.'
  usage: '<#BFC7D5>Usage: <white>{usage}'
