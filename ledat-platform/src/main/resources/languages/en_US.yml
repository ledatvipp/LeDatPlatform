  unknown: '<#FF5A6E>Unknown argument: <white>{argument}<#BFC7D5>. Use: <white>{usage}'
  input-fallback: '<#FFA94D>Inventory fallback cannot collect <white>{input}<#FFA94D>. <#BFC7D5>Use a 1.21.7+ client or the command fallback.'
  error: '<#FF5A6E>Command failed. Please check console. <#BFC7D5>(<white>{error}<#BFC7D5>)'
  reload: '<#55D68A>Core reloaded.'
  help-header: '<#BFC7D5>Available commands:'
  help-entry: '<dark_gray>- <white>{usage} <#BFC7D5>{description}'
  help-footer: '<dark_gray>------------------------'
  help-empty: '<#BFC7D5>No commands are available.'
gui:
  title: '<dark_gray>LeDat GUI - Page {page}'
  expired: '{prefix}<#FFA94D>GUI <white>{menu}<#FFA94D> expired. Please reopen it.'
