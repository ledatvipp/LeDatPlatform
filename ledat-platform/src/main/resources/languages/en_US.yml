forms:
  unavailable: '{prefix}<#FF5A6E>Bedrock form is unavailable. <#BFC7D5>{reason}'
  not-bedrock: '{prefix}<#FFA94D>This player is not detected as Bedrock/Floodgate.'
  expired: '{prefix}<#FFA94D>Form <white>{menu}<#FFA94D> expired. Please reopen it.'
  invalid: '{prefix}<#FF5A6E>That form response was rejected. <#BFC7D5>Please reopen the menu.'
  error: '{prefix}<#FF5A6E>Form <white>{menu}<#FF5A6E> failed while handling your action.'
  closed: '{prefix}<#BFC7D5>Form closed.'
  unsupported-input: '{prefix}<#FFA94D>Dialog <white>{dialog}<#FFA94D> has inputs that cannot be shown safely as a Bedrock form.'
  floodgate-missing: '{prefix}<#FF5A6E>Floodgate/Cumulus form bridge is unavailable. <#BFC7D5>{reason}'
